services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"      # อยู่หลัง Caddy เท่านั้น (ไม่เปิดพอร์ต 3000 สู่อินเทอร์เน็ต)
      COOKIE_SECURE: "1"
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
